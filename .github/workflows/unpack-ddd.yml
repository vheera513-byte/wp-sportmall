name: Extract DDD archive

on:
  push:
    branches: [main]
    paths:
      - 'DDD.zip'
      - '.github/workflows/unpack-ddd.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Safely extract archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          archive = Path("DDD.zip")
          target = Path("DDD")
          if target.exists():
              raise SystemExit("Refusing to overwrite an existing DDD directory")
          with ZipFile(archive) as z:
              root = target.resolve()
              for item in z.infolist():
                  dest = (target / item.filename).resolve()
                  if dest != root and root not in dest.parents:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
              z.extractall(".")
          print(f"Extracted {sum(1 for p in target.rglob('*') if p.is_file())} files")
          PY
      - name: Commit extracted files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/unpack-ddd.yml
          git add DDD .github/workflows/unpack-ddd.yml
          git commit -m "Extract DDD archive"
          git push origin main
